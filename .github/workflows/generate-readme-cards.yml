name: Generate README Cards

on:
  schedule:
    - cron: '0 16 * * *'  # 每天北京时间 00:00 (UTC+8)
  workflow_dispatch:  # 支持手动触发
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'api/**'
      - '.github/workflows/generate-readme-cards.yml'
      - '.github/cards-config.yml'

permissions:
  contents: write

jobs:
  generate-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Load configuration
        id: config
        run: |
          # 读取配置文件
          if [ -f .github/cards-config.yml ]; then
            echo "Configuration file found"
            cat .github/cards-config.yml
          else
            echo "No configuration file found, using defaults"
          fi

      - name: Start API server
        run: |
          # 启动API服务器
          node express.js &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          
          # 等待服务器启动
          for i in {1..30}; do
            if curl -s http://localhost:9000/api 2>&1 | grep -q "html\|svg"; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done
        env:
          PAT_1: ${{ secrets.GH_PAT }}

      - name: Generate cards
        run: |
          mkdir -p cards
          
          # GitHub Stats 卡片
          echo "Generating GitHub stats card..."
          curl -s "http://localhost:9000/api?username=Sheyiyuan&show_icons=true&hide_border=true&locale=cn&bg_color=00000000&title_color=3178C6&text_color=666666&icon_color=3178C6&hide_rank=true" \
            -o cards/github-stats.svg
          
          # Top Languages 卡片
          echo "Generating top languages card..."
          curl -s "http://localhost:9000/api/top-langs/?username=Sheyiyuan&hide_border=true&layout=compact&langs_count=8&locale=cn&hide=html,css,dockerfile,shell,powershell&size_weight=0.5&count_weight=0.5&bg_color=00000000&title_color=3178C6&text_color=666666" \
            -o cards/top-langs.svg
          
          # Half-Beat-Player 项目卡片（带技术栈）
          echo "Generating Half-Beat-Player card..."
          curl -s "http://localhost:9000/api/pin-custom/?username=Sheyiyuan&repo=Half-Beat-Player&hide_border=true&bg_color=00000000&title_color=3178C6&text_color=666666&icon_color=3178C6&show_owner=false&tech_stack=Wails,Go,Vue,TypeScript&description_lines_count=3" \
            -o cards/half-beat-player.svg
          
          # tuan-chat-web 项目卡片（带技术栈）
          echo "Generating tuan-chat-web card..."
          curl -s "http://localhost:9000/api/pin-custom/?username=starrybamboo&repo=tuan-chat-web&hide_border=true&bg_color=00000000&title_color=3178C6&text_color=666666&icon_color=3178C6&show_owner=false&tech_stack=React,TypeScript,Vite&description_lines_count=3" \
            -o cards/tuan-chat-web.svg
          
          echo "All cards generated successfully"
          ls -lh 
          if [ ! -z "$SERVER_PID" ]; then
            kill $SERVER_PID 2>/dev/null || true
          fi

      - name: Deploy to GitHub Pages
        run: |
          # 设置时区为北京时间
          export TZ='Asia/Shanghai'
          
          # 配置 Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 创建或切换到 gh-pages 分支
          git fetch origin gh-pages 2>/dev/null || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
            git pull origin gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf .
          fi
          
          # 复制生成的卡片
          cp -r cards/*.svg .
          
          # 创建 index.html 以便浏览
          cat > index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>GitHub README Cards</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 2rem; max-width: 1200px; margin: 0 auto; }
              h1 { color: #24292f; }
              .card { margin: 2rem 0; padding: 1rem; background: #f6f8fa; border-radius: 6px; }
              img { display: block; margin: 1rem 0; }
              code { background: #e3e8eb; padding: 2px 6px; border-radius: 3px; font-size: 0.9em; }
              pre { background: #24292f; color: #fff; padding: 1rem; border-radius: 6px; overflow-x: auto; }
            </style>
          </head>
          <body>
            <h1>GitHub README Cards</h1>
            <p>自动生成的 GitHub 统计卡片，可直接在 README 中使用。</p>
            
            <div class="card">
              <h2>GitHub 统计卡片</h2>
              <img src="github-stats.svg" alt="GitHub Stats">
              <h3>Markdown 使用方式</h3>
              <pre>![GitHub Stats](https://sheyiyuan.github.io/github-readme-stats/github-stats.svg)</pre>
              <h3>HTML 使用方式</h3>
              <pre>&lt;img src="https://sheyiyuan.github.io/github-readme-stats/github-stats.svg" alt="GitHub Stats"&gt;</pre>
            </div>
            
            <div class="card">
              <h2>语言统计卡片</h2>
              <img src="top-langs.svg" alt="Top Languages">
              <h3>Markdown 使用方式</h3>
              <pre>![Top Languages](https://sheyiyuan.github.io/github-readme-stats/top-langs.svg)</pre>
              <h3>HTML 使用方式</h3>
              <pre>&lt;img src="https://sheyiyuan.github.io/github-readme-stats/top-langs.svg" alt="Top Languages"&gt;</pre>
            </div>
            
            <div class="card">
              <h2>Half-Beat-Player 项目卡片</h2>
              <img src="half-beat-player.svg" alt="Half Beat Player">
              <h3>Markdown 使用方式</h3>
              <pre>![Half Beat Player](https://sheyiyuan.github.io/github-readme-stats/half-beat-player.svg)</pre>
              <h3>HTML 使用方式</h3>
              <pre>&lt;img src="https://sheyiyuan.github.io/github-readme-stats/half-beat-player.svg" alt="Half Beat Player"&gt;</pre>
            </div>
            
            <div class="card">
              <h2>tuan-chat-web 项目卡片</h2>
              <img src="tuan-chat-web.svg" alt="Tuan Chat Web">
              <h3>Markdown 使用方式</h3>
              <pre>![Tuan Chat Web](https://sheyiyuan.github.io/github-readme-stats/tuan-chat-web.svg)</pre>
              <h3>HTML 使用方式</h3>
              <pre>&lt;img src="https://sheyiyuan.github.io/github-readme-stats/tuan-chat-web.svg" alt="Tuan Chat Web"&gt;</pre>
            </div>
            
            <footer style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid #d0d7de; color: #656d76;">
              <p>由 GitHub Actions 自动生成和更新</p>
              <p>更新时间: TIMESTAMP_PLACEHOLDER</p>
            </footer>
          </body>
          </html>
          HTMLEOF
          
          # 替换时间戳
          sed -i "s/TIMESTAMP_PLACEHOLDER/$(date +'%Y-%m-%d %H:%M:%S') 北京时间/" index.html
          
          # 提交并推送
          git add *.svg index.html
          git commit -m "Update cards - $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push origin gh-pages
          
          # 切换回 master 分支
          git checkout master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate summary
        if: always()
        run: |
          # 设置时区为北京时间
          export TZ='Asia/Shanghai'
          
          echo "## 📊 GitHub README Cards Generation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **状态**: 卡片已生成并部署到 GitHub Pages" >> $GITHUB_STEP_SUMMARY
          echo "⏰ **执行时间**: $(date +'%Y-%m-%d %H:%M:%S') 北京时间" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 📦 生成的卡片" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub 统计卡片" >> $GITHUB_STEP_SUMMARY
          echo "- 语言统计卡片" >> $GITHUB_STEP_SUMMARY
          echo "- Half-Beat-Player 项目卡片 (带技术栈)" >> $GITHUB_STEP_SUMMARY
          echo "- tuan-chat-web 项目卡片 (带技术栈)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 🔗 使用方法" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Markdown 格式：**" >> $GITHUB_STEP_SUMMARY
          echo '```markdown' >> $GITHUB_STEP_SUMMARY
          echo "![GitHub Stats](https://sheyiyuan.github.io/github-readme-stats/github-stats.svg)" >> $GITHUB_STEP_SUMMARY
          echo "![Top Languages](https://sheyiyuan.github.io/github-readme-stats/top-langs.svg)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**HTML 格式：**" >> $GITHUB_STEP_SUMMARY
          echo '```html' >> $GITHUB_STEP_SUMMARY
          echo '<img src="https://sheyiyuan.github.io/github-readme-stats/github-stats.svg" alt="GitHub Stats">' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 [查看所有卡片](https://sheyiyuan.github.io/github-readme-stats/)" >> $GITHUB_STEP_SUMMARY