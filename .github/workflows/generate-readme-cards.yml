name: Generate README Cards

on:
  schedule:
    - cron: '0 16 * * *'  # 每天北京时间 00:00 (UTC+8)
  workflow_dispatch:  # 支持手动触发
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'api/**'
      - '.github/workflows/generate-readme-cards.yml'
      - '.github/cards-config.yml'

permissions:
  contents: write

jobs:
  generate-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Load configuration
        id: config
        run: |
          # 读取配置文件
          if [ -f .github/cards-config.yml ]; then
            echo "Configuration file found"
            cat .github/cards-config.yml
          else
            echo "No configuration file found, using defaults"
          fi

      - name: Start API server
        run: |
          # 启动API服务器
          node express.js &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          
          # 等待服务器启动
          for i in {1..30}; do
            if curl -s http://localhost:9000/api 2>&1 | grep -q "html\|svg"; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done
        env:
          PAT_1: ${{ secrets.GH_PAT }}

      - name: Generate cards
        run: |
          mkdir -p cards
          
          # GitHub Stats 卡片
          echo "Generating GitHub stats card..."
          curl -s "http://localhost:9000/api?username=Sheyiyuan&show_icons=true&hide_border=true&locale=cn&bg_color=00000000&title_color=3178C6&text_color=666666&icon_color=3178C6&hide_rank=true" \
            -o cards/github-stats.svg
          
          # Top Languages 卡片
          echo "Generating top languages card..."
          curl -s "http://localhost:9000/api/top-langs/?username=Sheyiyuan&hide_border=true&layout=compact&langs_count=8&locale=cn&hide=html,css,dockerfile,shell,powershell&size_weight=0.5&count_weight=0.5&bg_color=00000000&title_color=3178C6&text_color=666666" \
            -o cards/top-langs.svg
          
          # Half-Beat-Player 项目卡片（带技术栈）
          echo "Generating Half-Beat-Player card..."
          curl -s "http://localhost:9000/api/pin-custom/?username=Sheyiyuan&repo=Half-Beat-Player&hide_border=true&bg_color=00000000&title_color=3178C6&text_color=666666&icon_color=3178C6&show_owner=false&tech_stack=Wails,Go,Vue,TypeScript&description_lines_count=3" \
            -o cards/half-beat-player.svg
          
          # tuan-chat-web 项目卡片（带技术栈）
          echo "Generating tuan-chat-web card..."
          curl -s "http://localhost:9000/api/pin-custom/?username=starrybamboo&repo=tuan-chat-web&hide_border=true&bg_color=00000000&title_color=3178C6&text_color=666666&icon_color=3178C6&show_owner=false&tech_stack=React,TypeScript,Vite&description_lines_count=3" \
            -o cards/tuan-chat-web.svg
          
          echo "All cards generated successfully"
          ls -lh 
          if [ ! -z "$SERVER_PID" ]; then
            kill $SERVER_PID 2>/dev/null || true
          fi

      - name: Create Release with latest tag
        run: |
          # 设置时区为北京时间
          export TZ='Asia/Shanghai'
          
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          TAG_NAME="cards-latest"
          RELEASE_NAME="README Cards - $(date +'%Y-%m-%d %H:%M:%S')"
          
          # 删除旧的 latest release 和 tag（如果存在）
          gh release delete "$TAG_NAME" --yes 2>/dev/null || true
          git push --delete origin "$TAG_NAME" 2>/dev/null || true
          
          # 创建新的 release
          gh release create "$TAG_NAME" \
            --title "$RELEASE_NAME" \
            --notes "📊 自动生成的 GitHub README 卡片

          **生成时间**: $(date +'%Y-%m-%d %H:%M:%S') 北京时间
          
          **包含卡片**:
          - GitHub 统计卡片 (github-stats.svg)
          - 语言统计卡片 (top-langs.svg)
          - Half-Beat-Player 项目卡片 (half-beat-player.svg)
          - tuan-chat-web 项目卡片 (tuan-chat-web.svg)
          
          **使用方法**:
          \`\`\`markdown
          ![GitHub Stats](https://github.com/Sheyiyuan/github-readme-stats/releases/download/cards-latest/github-stats.svg)
          ![Top Languages](https://github.com/Sheyiyuan/github-readme-stats/releases/download/cards-latest/top-langs.svg)
          ![Half Beat Player](https://github.com/Sheyiyuan/github-readme-stats/releases/download/cards-latest/half-beat-player.svg)
          ![Tuan Chat Web](https://github.com/Sheyiyuan/github-readme-stats/releases/download/cards-latest/tuan-chat-web.svg)
          \`\`\`
          
          这些卡片使用自定义的 pin-custom API，支持技术栈徽章显示。
          
          🤖 由 GitHub Actions 自动生成" \
            cards/*.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate summary
        if: always()
        run: |
          # 设置时区为北京时间
          export TZ='Asia/Shanghai'
          
          echo "## 📊 GitHub README Cards Generation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.changes.outputs.has_changes }}" == "true" ]; then
            echo "✅ **状态**: 成功生成并更新卡片" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 已更新的卡片" >> $GITHUB_STEP_SUMMARY
            echo "- GitHub 统计卡片" >> $GITHUB_STEP_SUMMARY
            echo "- 语言统计卡片" >> $GITHUB_STEP_SUMMARY
            echo "- Half-Beat-Player 项目卡片 (带技术栈)" >> $GITHUB_STEP_SUMMARY
            echo "- tuan-chat-web 项目卡片 (带技术栈)" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **状态**: 无更新，卡片内容未变化" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⏰ **执行时间**: $(date +'%Y-%m-%d %H:%M:%S') 北京时间" >> $GITHUB_STEP_SUMMARY
          echo "✅ **状态**: 卡片已生成并发布到 Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 生成的卡片" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub 统计卡片" >> $GITHUB_STEP_SUMMARY
          echo "- 语言统计卡片" >> $GITHUB_STEP_SUMMARY
          echo "- Half-Beat-Player 项目卡片 (带技术栈)" >> $GITHUB_STEP_SUMMARY
          echo "- tuan-chat-web 项目卡片 (带技术栈)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 使用方法" >> $GITHUB_STEP_SUMMARY
          echo "在 Sheyiyuan/Sheyiyuan README 中使用以下 URL:" >> $GITHUB_STEP_SUMMARY
          echo '```markdown' >> $GITHUB_STEP_SUMMARY
          echo "![Stats](https://github.com/Sheyiyuan/github-readme-stats/releases/download/cards-latest/github-stats.svg)" >> $GITHUB_STEP_SUMMARY
          echo "![Langs](https://github.com/Sheyiyuan/github-readme-stats/releases/download/cards-latest/top-langs.svg)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY