name: Generate README Cards

on:
  schedule:
    - cron: '30 0,8,16 * * *'  # 每天北京时间 08:30, 16:30, 00:30 (UTC+8)
  workflow_dispatch:  # 支持手动触发
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run with debug logging'
        required: false
        default: false
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'api/**'
      - 'themes/**'
      - '.github/**'
      - 'package.json'

permissions:
  contents: write

jobs:
  generate-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Load configuration
        id: config
        run: |
          # 安装 yq 用于解析 YAML
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          
          # 读取配置文件
          if [ -f .github/cards-config.yml ]; then
            echo "Configuration file found"
            cat .github/cards-config.yml
          else
            echo "No configuration file found, using defaults"
          fi

      - name: Start API server
        run: |
          # 启动API服务器
          node express.js &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          
          # 等待服务器启动
          for i in {1..30}; do
            if curl -s http://localhost:9000/api 2>&1 | grep -q "html\|svg"; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done
        env:
          PAT_1: ${{ secrets.GH_PAT }}

      - name: Generate cards
        run: |
          mkdir -p cards
          
          # 读取配置文件
          CONFIG_FILE=".github/cards-config.yml"
          
          # 获取卡片数量
          CARD_COUNT=$(yq '.cards | length' $CONFIG_FILE)
          
          # 遍历所有卡片配置
          for i in $(seq 0 $((CARD_COUNT - 1))); do
            # 读取基本信息
            NAME=$(yq ".cards[$i].name" $CONFIG_FILE)
            FILENAME=$(yq ".cards[$i].filename" $CONFIG_FILE)
            ENDPOINT=$(yq ".cards[$i].endpoint" $CONFIG_FILE)
            BASE_URL=$(yq ".server.base_url" $CONFIG_FILE)
            
            echo "Generating $NAME card..."
            
            # 构建参数字符串
            PARAMS=""
            PARAM_KEYS=$(yq ".cards[$i].params | keys | .[]" $CONFIG_FILE)
            
            while IFS= read -r key; do
              value=$(yq ".cards[$i].params.$key" $CONFIG_FILE)
              # 处理 theme: transparent，转换为 bg_color
              if [ "$key" = "theme" ] && [ "$value" = "transparent" ]; then
                PARAMS="${PARAMS}&bg_color=00000000"
              else
                PARAMS="${PARAMS}&${key}=${value}"
              fi
            done <<< "$PARAM_KEYS"
            
            # 去掉开头的 &
            PARAMS="${PARAMS:1}"
            
            # 发起请求
            curl -s "${BASE_URL}${ENDPOINT}?${PARAMS}" -o "cards/${FILENAME}"
            
            echo "✓ Generated cards/${FILENAME}"
          done
          
          echo "All cards generated successfully"
          ls -lh cards/
          
      - name: Stop API server
        if: always()
        run: |
          if [ ! -z "$SERVER_PID" ]; then
            kill $SERVER_PID 2>/dev/null || true
          fi

      - name: Deploy to GitHub Pages
        run: |
          # 设置时区为北京时间
          export TZ='Asia/Shanghai'
          
          # 配置 Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 在切换分支前保存配置文件内容到临时文件
          CONFIG_FILE=".github/cards-config.yml"
          cp "$CONFIG_FILE" /tmp/cards-config.yml
          
          # 创建或切换到 gh-pages 分支
          git fetch origin gh-pages 2>/dev/null || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
            git pull origin gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf .
          fi
          
          # 复制生成的卡片
          cp -r cards/*.svg .
          
          # 使用之前保存的配置文件
          CONFIG_FILE="/tmp/cards-config.yml"
          
          # 生成 HTML 头部
          cat > index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>GitHub README Cards</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 2rem; max-width: 1200px; margin: 0 auto; }
              h1 { color: #24292f; }
              .card { margin: 2rem 0; padding: 1rem; background: #f6f8fa; border-radius: 6px; }
              img { display: block; margin: 1rem 0; }
              code { background: #e3e8eb; padding: 2px 6px; border-radius: 3px; font-size: 0.9em; }
              pre { background: #24292f; color: #fff; padding: 1rem; border-radius: 6px; overflow-x: auto; }
            </style>
          </head>
          <body>
            <h1>GitHub README Cards</h1>
            <p>自动生成的 GitHub 统计卡片，可直接在 README 中使用。</p>
          HTMLEOF
          
          # 动态生成每个卡片的展示区块
          CARD_COUNT=$(yq '.cards | length' $CONFIG_FILE)
          for i in $(seq 0 $((CARD_COUNT - 1))); do
            NAME=$(yq ".cards[$i].name" $CONFIG_FILE)
            FILENAME=$(yq ".cards[$i].filename" $CONFIG_FILE)
            
            # 生成卡片标题（美化名称）
            DISPLAY_NAME=$(echo "$NAME" | sed 's/-/ /g' | sed 's/\b\(.\)/\u\1/g')
            
            cat >> index.html << CARDEOF
            
            <div class="card">
              <h2>${DISPLAY_NAME}</h2>
              <img src="${FILENAME}" alt="${DISPLAY_NAME}">
              <h3>Markdown 使用方式</h3>
              <pre>![${DISPLAY_NAME}](https://sheyiyuan.github.io/github-readme-stats/${FILENAME})</pre>
              <h3>HTML 使用方式</h3>
              <pre>&lt;img src="https://sheyiyuan.github.io/github-readme-stats/${FILENAME}" alt="${DISPLAY_NAME}"&gt;</pre>
            </div>
          CARDEOF
          done
          
          # 生成 HTML 尾部
          cat >> index.html << 'FOOTEREOF'
            
            <footer style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid #d0d7de; color: #656d76;">
              <p>由 GitHub Actions 自动生成和更新</p>
              <p>更新时间: TIMESTAMP_PLACEHOLDER</p>
            </footer>
          </body>
          </html>
          FOOTEREOF
          
          # 替换时间戳
          sed -i "s/TIMESTAMP_PLACEHOLDER/$(date +'%Y-%m-%d %H:%M:%S') 北京时间/" index.html
          
          # 提交并推送
          git add *.svg index.html
          git commit -m "Update cards - $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push origin gh-pages
          
          # 切换回 master 分支
          git checkout master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate summary
        if: always()
        run: |
          # 设置时区为北京时间
          export TZ='Asia/Shanghai'
          
          echo "## 📊 GitHub README Cards Generation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **状态**: 卡片已生成并部署到 GitHub Pages" >> $GITHUB_STEP_SUMMARY
          echo "⏰ **执行时间**: $(date +'%Y-%m-%d %H:%M:%S') 北京时间" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 📦 生成的卡片" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub 统计卡片" >> $GITHUB_STEP_SUMMARY
          echo "- 语言统计卡片" >> $GITHUB_STEP_SUMMARY
          echo "- Half-Beat-Player 项目卡片 (带技术栈)" >> $GITHUB_STEP_SUMMARY
          echo "- tuan-chat-web 项目卡片 (带技术栈)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 🔗 使用方法" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Markdown 格式：**" >> $GITHUB_STEP_SUMMARY
          echo '```markdown' >> $GITHUB_STEP_SUMMARY
          echo "![GitHub Stats](https://sheyiyuan.github.io/github-readme-stats/github-stats.svg)" >> $GITHUB_STEP_SUMMARY
          echo "![Top Languages](https://sheyiyuan.github.io/github-readme-stats/top-langs.svg)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**HTML 格式：**" >> $GITHUB_STEP_SUMMARY
          echo '```html' >> $GITHUB_STEP_SUMMARY
          echo '<img src="https://sheyiyuan.github.io/github-readme-stats/github-stats.svg" alt="GitHub Stats">' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 [查看所有卡片](https://sheyiyuan.github.io/github-readme-stats/)" >> $GITHUB_STEP_SUMMARY